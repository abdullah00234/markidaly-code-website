<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <filter id="cardShadowD" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1f3a" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="thumbGradD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c86ff"/>
      <stop offset="100%" stop-color="#1f5eff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#f7f9fc"/>
  <rect x="90" y="80" width="1020" height="740" rx="40" fill="#ffffff" stroke="#e3e8f0" stroke-width="2" filter="url(#cardShadowD)"/>

  <circle cx="140" cy="145" r="4" fill="#c9a227"/>
  <text x="156" y="150" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.5" fill="#1f5eff">LISTING + BUDGET + CAMPAIGN</text>

  <!-- product listing card -->
  <rect x="200" y="240" width="330" height="400" rx="24" fill="#f7f9fc" stroke="#e3e8f0" stroke-width="2"/>
  <rect x="230" y="270" width="270" height="180" rx="14" fill="#eaf0ff" stroke="#1f5eff" stroke-width="1.5"/>
  <path d="M300 400 L360 340 L400 380 L460 320" stroke="#4c86ff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="230" y="474" width="200" height="16" rx="8" fill="#dbe2ee"/>
  <rect x="230" y="504" width="140" height="16" rx="8" fill="#dbe2ee"/>
  <rect x="230" y="548" width="90" height="28" rx="8" fill="#c9a227"/>
  <text x="275" y="568" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0b1f3a">$24.99</text>
  <text x="365" y="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#4b5768">SCROLL-STOPPING LISTING</text>

  <!-- budget slider -->
  <rect x="600" y="290" width="360" height="12" rx="6" fill="#e3e8f0"/>
  <rect x="600" y="290" width="230" height="12" rx="6" fill="url(#thumbGradD)"/>
  <circle cx="830" cy="296" r="22" fill="#ffffff" stroke="#1f5eff" stroke-width="5"/>
  <text x="780" y="710" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#4b5768">IDEAL BUDGET</text>

  <!-- DSP target -->
  <circle cx="780" cy="480" r="90" fill="#eaf0ff" stroke="#1f5eff" stroke-width="2"/>
  <circle cx="780" cy="480" r="58" fill="#ffffff" stroke="#4c86ff" stroke-width="2"/>
  <circle cx="780" cy="480" r="26" fill="#0b1f3a" stroke="#c9a227" stroke-width="3"/>
  <circle cx="780" cy="480" r="6" fill="#c9a227"/>
  <line x1="900" y1="400" x2="812" y2="466" stroke="#c9a227" stroke-width="6" stroke-linecap="round"/>
  <text x="780" y="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#4b5768">LASER-FOCUSED DSP</text>

  <text x="600" y="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#1f5eff">BUILT AND REFINED, TOGETHER.</text>
</svg>
