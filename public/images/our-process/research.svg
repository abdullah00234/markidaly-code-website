<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <filter id="cardShadowR" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1f3a" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="barGradR" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1f5eff"/>
      <stop offset="100%" stop-color="#4c86ff"/>
    </linearGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="#f7f9fc"/>
  <rect x="90" y="80" width="1020" height="740" rx="40" fill="#ffffff" stroke="#e3e8f0" stroke-width="2" filter="url(#cardShadowR)"/>

  <circle cx="140" cy="145" r="4" fill="#c9a227"/>
  <text x="156" y="150" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.5" fill="#1f5eff">ACCOUNT DIAGNOSTIC</text>

  <!-- baseline -->
  <line x1="270" y1="660" x2="930" y2="660" stroke="#e3e8f0" stroke-width="2"/>

  <!-- bars: advertising, listings, conversion, inventory, operations -->
  <rect x="300" y="470" width="90" height="190" rx="10" fill="#eaf0ff" stroke="#1f5eff" stroke-width="1.5" opacity="0.8"/>
  <rect x="430" y="380" width="90" height="280" rx="10" fill="#eaf0ff" stroke="#1f5eff" stroke-width="1.5" opacity="0.8"/>
  <rect x="560" y="300" width="90" height="360" rx="10" fill="url(#barGradR)"/>
  <rect x="690" y="430" width="90" height="230" rx="10" fill="#eaf0ff" stroke="#1f5eff" stroke-width="1.5" opacity="0.8"/>
  <rect x="820" y="500" width="90" height="160" rx="10" fill="#eaf0ff" stroke="#1f5eff" stroke-width="1.5" opacity="0.8"/>

  <text x="345" y="686" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4b5768">Ads</text>
  <text x="475" y="686" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4b5768">Listings</text>
  <text x="605" y="686" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0b1f3a">Conversion</text>
  <text x="735" y="686" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4b5768">Inventory</text>
  <text x="865" y="686" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4b5768">Ops</text>

  <!-- magnifying glass highlighting the real constraint -->
  <circle cx="605" cy="320" r="120" fill="url(#glowR)"/>
  <circle cx="605" cy="320" r="86" fill="none" stroke="#c9a227" stroke-width="8"/>
  <line x1="666" y1="381" x2="735" y2="450" stroke="#c9a227" stroke-width="16" stroke-linecap="round"/>
  <circle cx="605" cy="320" r="6" fill="#c9a227"/>

  <text x="600" y="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#1f5eff">TROUBLE SPOTS, MAPPED.</text>
</svg>
