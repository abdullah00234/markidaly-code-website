<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <filter id="cardShadowG" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1f3a" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="lineGradG" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f5eff"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="#f7f9fc"/>
  <rect x="90" y="80" width="1020" height="740" rx="40" fill="#ffffff" stroke="#e3e8f0" stroke-width="2" filter="url(#cardShadowG)"/>

  <circle cx="140" cy="145" r="4" fill="#c9a227"/>
  <text x="156" y="150" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.5" fill="#1f5eff">SCALING WHAT WORKS</text>

  <!-- baseline -->
  <line x1="240" y1="640" x2="960" y2="640" stroke="#e3e8f0" stroke-width="2"/>

  <!-- ascending bars -->
  <rect x="280" y="560" width="80" height="80" rx="8" fill="#eaf0ff" stroke="#1f5eff" stroke-width="1.5"/>
  <rect x="400" y="500" width="80" height="140" rx="8" fill="#eaf0ff" stroke="#1f5eff" stroke-width="1.5"/>
  <rect x="520" y="420" width="80" height="220" rx="8" fill="#dbe8ff" stroke="#1f5eff" stroke-width="1.5"/>
  <rect x="640" y="330" width="80" height="310" rx="8" fill="url(#lineGradG)"/>
  <rect x="760" y="230" width="80" height="410" rx="8" fill="url(#lineGradG)"/>

  <!-- growth arrow breaking through -->
  <circle cx="860" cy="230" r="130" fill="url(#glowG)"/>
  <path d="M300 610 L440 520 L560 470 L680 380 L860 230" fill="none" stroke="#c9a227" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M790 210 L860 230 L840 300" fill="none" stroke="#c9a227" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="860" cy="230" r="14" fill="#0b1f3a" stroke="#c9a227" stroke-width="4"/>

  <text x="600" y="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#1f5eff">INVEST IN WHAT'S WORKING.</text>
</svg>
